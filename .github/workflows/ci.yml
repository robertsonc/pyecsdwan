name: CI

# The gate this repository ran locally and nowhere else (issue #65). The
# Makefile's `check` target is the same three steps; this runs them on every
# push and pull request, on every supported interpreter.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never let a test reach for a real Orchestrator or the operator's state dir.
  ECSDWAN_HOME: ${{ github.workspace }}/.ci-state

jobs:
  gate:
    name: gate (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: |
          uv venv .venv --python ${{ matrix.python }}
          uv pip install --python .venv/bin/python -e '.[dev]'

      - name: Lint
        run: .venv/bin/ruff check src tests tools contrib

      - name: Types
        run: .venv/bin/mypy

      - name: Tests
        run: .venv/bin/pytest

  wheel:
    name: wheel install (py${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build --out-dir dist

      # A clean environment, installed from the artifact — not from the source
      # checkout. The bug this catches is a file that exists in the repository
      # and never reaches the wheel, which a source-tree test cannot see.
      - name: Install the wheel into a clean environment
        run: |
          uv venv .install --python ${{ matrix.python }}
          uv pip install --python .install/bin/python dist/*.whl

      - name: Smoke — the CLI is installed and runs
        run: |
          cd "$RUNNER_TEMP"          # away from the source tree, deliberately
          "$GITHUB_WORKSPACE/.install/bin/ec-cli" --help
          "$GITHUB_WORKSPACE/.install/bin/ec-cli" show coverage --help

      - name: Smoke — the packaged baselines are present and complete
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.install/bin/python" - <<'PY'
          from pyecsdwan import specs

          directory = specs.specs_dir()
          assert directory is not None, "installed package ships no API baselines"
          endpoints = list(specs.iter_endpoints())
          # An installed `show coverage` used to report an empty universe as
          # though it were the answer. Assert the real number, not just > 0.
          assert len(endpoints) == 1833, f"expected 1833 endpoints, got {len(endpoints)}"
          assert specs.payload_examples(), "payload examples missing from the wheel"
          print(f"ok: {len(endpoints)} endpoints from {directory}")
          PY

      - name: Smoke — show coverage reports the real universe
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.install/bin/ec-cli" show coverage > coverage.txt
          cat coverage.txt
          grep -q "of 1833 endpoints" coverage.txt

      - name: Smoke — the quarantined MCP server is not installed
        run: |
          cd "$RUNNER_TEMP"
          if "$GITHUB_WORKSPACE/.install/bin/python" -c "import mcp_server_legacy" 2>/dev/null; then
            echo "contrib/mcp_server_legacy must not ship in the wheel (#62)" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: dist
          path: dist/
          retention-days: 14
