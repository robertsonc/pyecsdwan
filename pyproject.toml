[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyecsdwan"
version = "0.1.0"
description = "Transactional CLI abstraction layer for HPE Aruba EdgeConnect SD-WAN (Orchestrator)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Corey Robertson" }]
keywords = ["sd-wan", "edgeconnect", "aruba", "orchestrator", "cli", "network-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]

# Pinned with compatible-release specifiers: reproducible enough for a CLI
# deployment target while allowing security patch releases.
dependencies = [
    "httpx~=0.28.1",
    "pydantic~=2.13",
    "typer~=0.27.1",
    "rich~=15.0",
    "prompt_toolkit~=3.0.52",
    "structlog~=26.1",
    "PyYAML~=6.0.3",
    "keyring~=25.7",
    # Envelope encryption for rollback-private secrets (#106). Already present
    # transitively on Linux (keyring -> SecretStorage), but the vault's use is
    # direct, and a direct use of a transitive dependency is a missing pin.
    "cryptography~=50.0",
]

[project.optional-dependencies]
mock = [
    "fastapi~=0.141.1",
    "uvicorn~=0.52.4",
]
# Quarantined legacy MCP server under contrib/ (#62). Not part of the product:
# it wraps the vendored reference SDK, not pyecsdwan, and nothing it does is
# transactional. Installing this extra does not enable it — see its README.
mcp-legacy = [
    "mcp~=1.20",
    "requests~=2.32",
]
dev = [
    "pytest~=9.1",
    "respx~=0.23.1",
    "mypy~=2.3",
    "ruff~=0.16.4",
    "types-PyYAML~=6.0.12",
    # `tomllib` is stdlib only from 3.11; the packaging tests read pyproject.toml
    # and this repo supports 3.10.
    "tomli~=2.3; python_version < '3.11'",
    "fastapi~=0.141.1",
    "uvicorn~=0.52.4",
]

[project.scripts]
ec-cli = "pyecsdwan.cli.main:main"
sase-cli = "pyecsdwan.cli.main:main"

[project.urls]
Homepage = "https://github.com/robertsonc/pyecsdwan"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyecsdwan*"]

[tool.setuptools]
# Explicit, not inherited. With setuptools' default (`true`), package data
# ships because the file happens to be tracked by git and reached the sdist —
# so what lands in a wheel is decided by `git add`, and an untracked file is
# omitted silently. Declaring the contents below makes it reviewable instead.
include-package-data = false

# `py.typed` keeps the package typed for downstream consumers. The OpenAPI
# baselines and the Postman-derived payload examples are the source of truth
# `show coverage` reads: a wheel without them reported an empty endpoint
# universe as if that were the answer (issue #65). `_evidence/ledger.json` is
# the same argument for what has been *observed* (#66): an operator deciding
# whether to point this at production must be able to ask offline, from the
# wheel they installed.
# `tests/test_packaging.py` fails if a data file on disk is not covered here.
[tool.setuptools.package-data]
pyecsdwan = ["py.typed", "_specs/*.json", "_specs/*.md", "_evidence/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["pyedgeconnect", "examples", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "BLE", "RUF"]
ignore = [
    "S101", # assert use — fine in tests, and we exclude prod asserts by review
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B017"]
"src/pyecsdwan/mock/*" = ["S104"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
# files instead of packages: mypy refuses to combine the two, and tools/
# holds standalone strict-typed scripts the `make type` gate must cover too.
files = ["src/pyecsdwan", "tools", "contrib"]
strict = true
warn_unreachable = true
# The vendored pyedgeconnect reference SDK and repo examples are not ours to type.
exclude = "(pyedgeconnect|examples|build)/"

[[tool.mypy.overrides]]
module = ["keyring.*", "respx.*"]
ignore_missing_imports = true

# The quarantined legacy MCP server (#62) imports two packages this product
# does not depend on: `mcp` (only in the mcp-legacy extra) and the vendored
# reference SDK, which is not ours to type. Its *policy* module imports
# neither, which is the point — the security-relevant half type-checks and
# tests normally.
[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

# `exclude` keeps mypy from *collecting* the vendored SDK; it does not stop it
# following an import into it. It is a third-party reference copy, not ours to
# type or to fix.
[[tool.mypy.overrides]]
module = ["pyedgeconnect.*"]
follow_imports = "skip"
ignore_errors = true

# FastMCP is untyped and is not a product dependency, so its decorator reads as
# untyped here. Scoped to the one module that touches it.
[[tool.mypy.overrides]]
module = ["mcp_server_legacy.server"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# contrib/ is not installed with the package, so the quarantine tests need it
# on the path explicitly (#62).
pythonpath = ["contrib"]
addopts = "-q"
markers = [
    "slow: end-to-end tests with real detached processes and sleeps",
    "live: optional smoke tests against a real Orchestrator (needs ECSDWAN_ORCH_URL)",
]
filterwarnings = ["error::DeprecationWarning:pyecsdwan.*"]
